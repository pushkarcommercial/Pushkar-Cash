name: iOS Build (Secrets p12, No Login)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Sign with Secrets and Upload TestFlight
    # App Store 上传要求 iOS 26 SDK（Xcode 26+）；macos-14 仅含 Xcode 16.x
    runs-on: macos-26
    timeout-minutes: 90

    env:
      IOS_PROJECT_DIR: "."
      SCHEME_NAME: FlexRupee
      DEVELOPMENT_TEAM: T5G2KQ77GZ
      # CocoaPods 生成的工作区名，与 Podfile 里 target 名一致
      WORKSPACE_NAME: FlexRupee.xcworkspace
      # 与 Xcode → Build Settings 一致（Manual 签名）
      BUNDLE_ID:  com.pushkarcash.morvex.point
      PROVISIONING_PROFILE_SPECIFIER: pushkarcashPro
      CI: true
      COCOAPODS_DISABLE_STATS: true

    defaults:
      run:
        working-directory: ${{ env.IOS_PROJECT_DIR }}

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 须 ≥ 26.2（含 iOS 26 SDK），否则上传 TestFlight 会报 SDK version issue
          xcode-version: "26.2"

      - name: 确认 Xcode / SDK 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: 从 Secrets 安装签名证书与描述文件
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 后续 xcodebuild / gym 必须使用此钥匙串（否则会找不到 Distribution 证书）
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=== 临时钥匙串中的签名身份（供对照）==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "CODE_SIGN_IDENTITY=Apple Distribution" >> "$GITHUB_ENV"
            echo "检测到 CODE_SIGN_IDENTITY=Apple Distribution"
          elif security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "iPhone Distribution"; then
            echo "CODE_SIGN_IDENTITY=iPhone Distribution" >> "$GITHUB_ENV"
            echo "检测到 CODE_SIGN_IDENTITY=iPhone Distribution"
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PP_PATH" > "$PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PLIST" 2>/dev/null || echo "unknown")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "描述文件 Name: $PROFILE_NAME"
          echo "描述文件 UUID: $PROFILE_UUID"
          echo "application-identifier: $APP_ID"
          echo "期望 PROVISIONING_PROFILE_SPECIFIER=${{ env.PROVISIONING_PROFILE_SPECIFIER }}"

      - name: 确认已提交的 Pods / workspace（不跑 pod install / 不用 Ruby）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -d Pods || { echo "::error::仓库缺少 Pods/，请本机 pod install 后提交"; exit 1; }
          test -d "${{ env.WORKSPACE_NAME }}" || { echo "::error::缺少 ${{ env.WORKSPACE_NAME }}"; exit 1; }
          ls -la *.xcworkspace *.xcodeproj Podfile.lock 2>/dev/null || true

      - name: 列出 Schemes（核对 SCHEME_NAME）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          xcodebuild -list -workspace "${{ env.WORKSPACE_NAME }}" || xcodebuild -list

      - name: Archive（xcodebuild）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          set -o pipefail
          xcodebuild archive \
            -workspace "${{ env.WORKSPACE_NAME }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive" \
            DEVELOPMENT_TEAM="${{ env.DEVELOPMENT_TEAM }}" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          test -d "$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive"

      - name: 校验 PrivacyInfo（主 App + Alamofire）
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive"
          APP="$ARCHIVE/Products/Applications/${{ env.SCHEME_NAME }}.app"
          test -d "$APP" || { echo "::error::未找到 ${{ env.SCHEME_NAME }}.app"; ls -la "$ARCHIVE/Products/Applications" || true; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::主 App 缺少 PrivacyInfo.xcprivacy"; find "$ARCHIVE" -name "PrivacyInfo.xcprivacy" -print || true; exit 1; }
          /usr/bin/plutil -lint "$APP/PrivacyInfo.xcprivacy"
          AF="$APP/Frameworks/Alamofire.framework/PrivacyInfo.xcprivacy"
          if [ -d "$APP/Frameworks/Alamofire.framework" ]; then
            test -f "$AF" || { echo "::error::Alamofire.framework 缺少 PrivacyInfo.xcprivacy"; ls -la "$APP/Frameworks/Alamofire.framework" || true; exit 1; }
            /usr/bin/plutil -lint "$AF"
            echo "OK: Alamofire PrivacyInfo"
          fi
          echo "OK: $APP/PrivacyInfo.xcprivacy"

      - name: 导出 IPA 并上传 App Store Connect
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXPORT_DIR="$RUNNER_TEMP/export"
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$EXPORT_DIR"
          python3 << PY
          import textwrap, pathlib
          pathlib.Path("$PLIST").write_text(textwrap.dedent("""\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ env.DEVELOPMENT_TEAM }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>${{ env.PROVISIONING_PROFILE_SPECIFIER }}</string>
            </dict>
          </dict>
          </plist>
          """))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ env.SCHEME_NAME }}.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$PLIST"
          IPA=$(ls "$EXPORT_DIR"/*.ipa | head -1)
          echo "IPA=$IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: 上传构建日志（失败时下载排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: 清理临时钥匙串
        if: always()
        working-directory: ${{ github.workspace }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
